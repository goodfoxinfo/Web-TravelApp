// ── historyBlocks — derive semantic summaries from messages ──────────────────
function historyBlocks(messages) {
  const blocks = [];
  const userMsgs = messages.filter(m => m.role === "user");
  if (userMsgs.length > 0) {
    blocks.push({ label: "Запрос пользователя", summary: userMsgs[userMsgs.length - 1].text });
  }
  if (messages.length > 2) {
    blocks.push({ label: "Контекст диалога", summary: "Обсуждается планирование поездки. Агент уточняет детали группы и даты." });
  }
  if (messages.length > 5) {
    blocks.push({ label: "Выявленные потребности", summary: "Семейная поездка, комфортный темп, гастрономия и культура." });
  }
  if (messages.length > 7) {
    blocks.push({ label: "Следующий шаг", summary: "Подобрать варианты маршрутов с учётом интересов всех участников." });
  }
  return blocks;
}

// ── ChatView ──────────────────────────────────────────────────────────────────
function ChatView() {
  const [messages, setMessages] = useState(INITIAL_MESSAGES);
  const [input, setInput] = useState("");
  const [typing, setTyping] = useState(false);
  const [activeAgent, setActiveAgent] = useState(1);
  const endRef = useRef(null);

  useEffect(() => {
    if (endRef.current) endRef.current.scrollIntoView({ block: "nearest" });
  }, [messages, typing]);

  const QUICK = ["Хочу спланировать поездку", "Подобрать места для посещения", "Создать маршрут", null];
  const hasUserMsg = messages.some(m => m.role === "user");

  const send = (text) => {
    if (!text.trim()) return;
    setMessages(m => [...m, { id: Date.now(), role: "user", text }]);
    setInput("");
    setTyping(true);
    setTimeout(() => {
      setMessages(m => [...m, { id: Date.now() + 1, role: "ai", text: "Хорошо, давайте разберём это подробнее. Какие даты вас интересуют и сколько человек будет в группе?" }]);
      setTyping(false);
    }, 1200);
  };

  return (
    <>
      {/* col 2: agents list */}
      <div style={{ width: 240, flexShrink: 0, overflowY: "auto", borderRight: `1px solid ${SEP}` }}>
        {AGENTS.map((a, i) => (

            cursor: "pointer",
            background: activeAgent === a.id ? "#fafafa" : "#fff",

            <AgentAvatar />
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontSize: 13.5, fontWeight: 500, color: "#1a1a1a" }}>{a.name}</div>
              <div style={{ fontSize: 11.5, color: MUTED, marginTop: 1 }}>{a.meta}</div>
              <div style={{ fontSize: 11.5, color: MUTED }}>{a.role}</div>
            </div>
            <button style={{ background: "none", border: "none", cursor: "pointer", padding: 4, opacity: 0.5 }}><Ico.More /></button>
          </div>
        ))}
      </div>

      {/* col 3: messages */}
      <div style={{ flex: 1, display: "flex", flexDirection: "column" }}>
        <div style={{ flex: 1, overflowY: "auto", padding: "20px 24px", display: "flex", flexDirection: "column", gap: 14 }}>
          {messages.map((msg, idx) => (
            <React.Fragment key={msg.id}>
              <div style={{ display: "flex", gap: 10, flexDirection: msg.role === "user" ? "row-reverse" : "row", alignItems: "flex-end" }}>
                {msg.role === "ai" && <AvatarCircle color="#6155F5" />}
                {msg.role === "user" && <AvatarCircle color="#34C759" />}
                <div style={{
                  maxWidth: "60%", padding: "9px 13px",
                  borderRadius: msg.role === "user" ? "12px 12px 2px 12px" : "12px 12px 12px 2px",
                  background: msg.role === "user" ? "#F4EFE7" : "#ffffff",
                  color: "#000000", fontSize: 13.5, lineHeight: 1.55,
                }}>{msg.text}</div>
              </div>
              {/* Quick actions after first AI message — aligned with agent bubble */}
              {idx === 0 && (
                <div style={{ display: "flex", flexDirection: "column", gap: 6, paddingLeft: 42 }}>
                  {QUICK.map((q, i) => q === null ? (
                    <button key="add" onClick={() => {}} style={{ alignSelf: "flex-start", display: "flex", alignItems: "center", gap: 6, border: "none", background: "none", cursor: "pointer", padding: "2px 0", color: MUTED }}>
                      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                      <span style={{ fontSize: 12.5, fontFamily: "inherit" }}>Отправить</span>
                    </button>
                  ) : (
                    <button key={q} onClick={() => send(q)} style={{ alignSelf: "flex-start", display: "flex", alignItems: "center", gap: 8, border: "none", background: "none", cursor: "pointer", fontSize: 13.5, color: "#1a1a1a", lineHeight: 1.4, padding: "2px 0" }}>
                      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#ccc" strokeWidth="1.2"><circle cx="7" cy="7" r="6"/></svg>
                      {q}
                    </button>
                  ))}
                </div>
              )}
            </React.Fragment>
          ))}

          {typing && (
            <div style={{ display: "flex", gap: 10, alignItems: "flex-end" }}>
              <AvatarCircle color="#6155F5" />
              <div style={{ padding: "9px 14px", borderRadius: "12px 12px 12px 2px", background: "#f5f5f5", display: "flex", gap: 4, alignItems: "center" }}>
                {[0,1,2].map(i => <div key={i} style={{ width: 6, height: 6, borderRadius: "50%", background: "#ccc", animation: `dot .9s ${i*.15}s infinite` }} />)}
              </div>
            </div>
          )}
          <div ref={endRef} />
        </div>
        <div style={{ padding: "12px 24px 20px", borderTop: `1px solid ${SEP}` }}>
          <div style={{ display: "flex", gap: 8, alignItems: "center", border: `1px solid ${SEP}`, borderRadius: 8, padding: "9px 14px" }}>
            <input
              value={input}
              onChange={e => setInput(e.target.value)}
              onKeyDown={e => e.key === "Enter" && send(input)}
              placeholder="Написать сообщение..."
              style={{ flex: 1, border: "none", outline: "none", fontSize: 14, color: "#1a1a1a", background: "none" }}
            />
            <button onClick={() => send(input)} style={{ background: "none", border: "none", cursor: "pointer", display: "flex", padding: 0 }}>
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#999" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>
          </div>
        </div>
      </div>

      {/* col 4: история / суммаризация */}
      <div style={{ width: 260, flexShrink: 0, borderLeft: `1px solid ${SEP}`, overflowY: "auto" }}>
        <div style={{ padding: "16px 18px", display: "flex", flexDirection: "column", gap: 16 }}>
          {historyBlocks(messages).map((block, i) => (
            <div key={i}>
              <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 8, marginBottom: 5 }}>
                <div style={{ fontSize: 13.5, fontWeight: 700, color: "#1a1a1a" }}>{block.label}</div>
                <button style={{ background: "none", border: "none", cursor: "pointer", padding: 2, opacity: 0.4, flexShrink: 0 }}><Ico.More /></button>
              </div>
              <div style={{ fontSize: 13, color: "#1a1a1a", lineHeight: 1.55 }}>{block.summary}</div>
            </div>
          ))}
          {messages.length <= 3 && (
            <div style={{ fontSize: 13, color: MUTED, lineHeight: 1.6 }}>
              История появится по мере развития диалога
            </div>
          )}
        </div>
      </div>
    </>
  );
}

// ── PlaceholderView ───────────────────────────────────────────────────────────
function PlaceholderView({ title }) {
  return (
    <>
      <div style={{ width: 240, flexShrink: 0, display: "flex", flexDirection: "column" }}>
        <div style={{ height: HDR_H, padding: "0 20px", display: "flex", alignItems: "center", gap: 12, borderBottom: `1px solid ${SEP}` }}>
          <span style={{ fontSize: 16, fontWeight: 700 }}>{title}</span>
          <button style={{ background: "none", border: "none", cursor: "pointer", padding: 2 }}><Ico.Plus /></button>
        </div>
        <div style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center" }}>
          <span style={{ fontSize: 13, color: MUTED }}>Список пуст</span>
        </div>
      </div>
      <ColDiv />
      <div style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", flexDirection: "column", gap: 8 }}>
        <span style={{ fontSize: 13, color: MUTED }}>Выберите элемент слева</span>
      </div>
      <ColDiv />
      <div style={{ width: 240, flexShrink: 0 }}>
        <div style={{ height: HDR_H, borderBottom: `1px solid ${SEP}` }} />
      </div>
    </>
  );
}

// ── APP ───────────────────────────────────────────────────────────────────────
function App() {
  const [activeNav, setActiveNav] = useState("Контакты");
  const [collapsed, setCollapsed] = useState(false);
  const [tweaks, setTweak] = useTweaks(/*EDITMODE-BEGIN*/{"accent":"#1a1a1a"}/*EDITMODE-END*/);

  const NAV_WIDTH = collapsed ? 52 : 200;

  const renderContent = () => {
    if (activeNav === "Чат с Агентом") return <ChatView />;
    if (activeNav === "Контакты" || activeNav === "Агенты") return <ContactsView activeNav={activeNav} />;
    return <PlaceholderView title={activeNav} />;
  };

  const listTitle = activeNav === "Агенты" ? "Агенты" : activeNav === "Чат с Агентом" ? "Действия" : activeNav;

  const headerCols = () => {
    if (activeNav === "Чат с Агентом") return (
      <>
        <ColDiv />
        <div style={{ width: 240, flexShrink: 0, display: "flex", alignItems: "center", padding: "0 20px" }}>
          <span style={{ fontSize: 16, fontWeight: 700 }}>Агенты</span>
        </div>
        <ColDiv />
        <div style={{ flex: 1, display: "flex", alignItems: "center", padding: "0 24px" }}>
          <span style={{ fontSize: 16, fontWeight: 700 }}>Чат</span>
        </div>
        <ColDiv />
        <div style={{ width: 260, flexShrink: 0, display: "flex", alignItems: "center", padding: "0 20px" }}>
          <span style={{ fontSize: 16, fontWeight: 700 }}>История</span>
        </div>
      </>
    );
    return (
      <>
        <ColDiv />
        <div style={{ width: 240, flexShrink: 0, display: "flex", alignItems: "center", gap: 10, padding: "0 20px" }}>
          <span style={{ fontSize: 16, fontWeight: 700 }}>{listTitle}</span>
          <button style={{ background: "none", border: "none", cursor: "pointer", display: "flex", padding: 4 }}><Ico.Plus /></button>
        </div>
        <ColDiv />
        <div style={{ flex: 1, display: "flex", alignItems: "center", gap: 14, padding: "0 22px" }}>
          <span style={{ fontSize: 16, fontWeight: 700, flex: 1 }}>Профиль</span>
          <Ico.Doc /><Ico.Gear /><Ico.Tag /><Ico.Edit /><Ico.Save />
        </div>
        <ColDiv />
        <div style={{ width: 240, flexShrink: 0, display: "flex", alignItems: "center", padding: "0 20px" }}>
          <span style={{ fontSize: 16, fontWeight: 700 }}>Изменить</span>
        </div>
      </>
    );
  };

  return (
    <div style={{ height: "100vh", display: "flex", flexDirection: "column", background: "#fff" }}>

      {/* ── top header row ── */}
      <div style={{ display: "flex", height: HDR_H, borderBottom: `1px solid ${SEP}`, flexShrink: 0, alignItems: "center" }}>
        <div style={{ width: NAV_WIDTH, flexShrink: 0, display: "flex", alignItems: "center", gap: collapsed ? 0 : 10, padding: collapsed ? "0 14px" : "0 18px", transition: "width .2s", overflow: "hidden" }}>
          <button onClick={() => setCollapsed(c => !c)} style={{ background: "none", border: "none", cursor: "pointer", padding: 2, display: "flex", flexShrink: 0 }}>
            <Ico.Menu />
          </button>
          {!collapsed && <span style={{ fontSize: 15, fontWeight: 700, letterSpacing: -0.3, whiteSpace: "nowrap" }}>TravelApp</span>}
        </div>
        {headerCols()}
      </div>

      {/* ── main area ── */}
      <div style={{ flex: 1, display: "flex", overflow: "hidden" }}>

        {/* ── col 1: nav ── */}
        <div style={{ width: NAV_WIDTH, flexShrink: 0, borderRight: `1px solid ${SEP}`, overflowY: "auto", overflowX: "hidden", transition: "width .2s" }}>
          <nav style={{ paddingTop: 8 }}>
            {NAV_ITEMS.map(item => (
              <button key={item} onClick={() => setActiveNav(item)} title={item} style={{
                display: "flex", alignItems: "center", gap: 10,
                width: "100%", textAlign: "left",
                padding: collapsed ? "11px 0" : "10px 20px",
                justifyContent: collapsed ? "center" : "flex-start",
                border: "none", background: "none",
                fontSize: 14.5, cursor: "pointer",
                fontWeight: activeNav === item ? 600 : 400,
                color: activeNav === item ? "#1a1a1a" : "#555",
                lineHeight: 1.4,
                transition: "color .12s",
                overflow: "hidden",
              }}>
                {/* placeholder circle icon */}
                <div style={{
                  width: 20, height: 20, borderRadius: "50%", flexShrink: 0,
                  border: `1.5px solid ${activeNav === item ? "#1a1a1a" : "#ccc"}`,
                  background: activeNav === item ? "#1a1a1a" : "none",
                  transition: "all .15s",
                }} />
                {!collapsed && <span style={{ whiteSpace: "nowrap" }}>{item}</span>}
              </button>
            ))}
          </nav>
        </div>

        {/* ── cols 2-4: dynamic content ── */}
        <div style={{ flex: 1, display: "flex", overflow: "hidden", minWidth: 0 }}>
          {renderContent()}
        </div>
      </div>

      <TweaksPanel>
        <TweakSection title="Навигация">
          <TweakRadio tweakKey="accent" label="Стиль активного пункта" options={["#1a1a1a","#e8673a","#2563eb"]} />
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

// animation
const s = document.createElement("style");
s.textContent = `@keyframes dot{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-5px)}}`;
document.head.appendChild(s);

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
